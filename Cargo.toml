[package]
name = "terminal"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = { version = "3.7.0", default-features = false }
bytemuck = { version = "1.25.2", features = ["derive"] }
fontdb = "0.24.0"
fontdue = "0.9.5"
libghostty-vt = "0.2.2"
mlua = { version = "0.12.2", features = ["lua54", "vendored", "serialize"] }
pollster = "1.0.1"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_path_to_error = "0.1.20"
ttf-parser = "0.25"
wgpu = "30.0.1"
winit = "0.30.13"
